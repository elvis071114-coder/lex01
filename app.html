<script>let AC=null,MASTER=null,REV=null,PKG=null,BUF={},PACK={};
const sndOn=()=>S.set.sfx!==false;
const curSnd=()=>pickPart('snd',SETS);
function setVol(){if(MASTER)MASTER.gain.setTargetAtTime((S.set.vol??.5)*.8,AC.currentTime,.02);if(PKG)PKG.gain.setTargetAtTime((S.set.vol??.5)*1.2,AC.currentTime,.02)}
async function audioInit(){
if(AC){AC.resume();return}
try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
MASTER=AC.createGain();MASTER.gain.value=(S.set.vol??.5)*.8;
const comp=AC.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;comp.attack.value=.01;comp.release.value=.25;
const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2300;lp.Q.value=.3;const sh=AC.createBiquadFilter();sh.type='highshelf';sh.frequency.value=1500;sh.gain.value=-8;
MASTER.connect(lp).connect(sh).connect(comp).connect(AC.destination);
PKG=AC.createGain();PKG.gain.value=(S.set.vol??.5)*1.2;PKG.connect(comp);
packInit();
const len=AC.sampleRate*1.8,ir=AC.createBuffer(2,len,AC.sampleRate);
for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2)}
REV=AC.createConvolver();REV.buffer=ir;const wet=AC.createGain();wet.gain.value=.36;REV.connect(wet).connect(MASTER);
for(const [k,u] of Object.entries(M01SFX)){try{const b=Uint8Array.from(atob(u.split(',')[1]),c=>c.charCodeAt(0)).buffer;BUF[k]=await AC.decodeAudioData(b)}catch(e){}}
}
function packInit(){for(const k of Object.keys(SNDPACK)){try{const bin=atob(SNDPACK[k]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);AC.decodeAudioData(u.buffer,b=>{PACK[k]=b},()=>{})}catch(e){}}}
function pk(names,v=1,rate=1){const k=Array.isArray(names)?names[Math.floor(Math.random()*names.length)]:names,b=PACK[k];if(!b||!AC||!PKG)return false;try{const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;s.playbackRate.value=rate*(.97+Math.random()*.06);g.gain.value=v;s.connect(g).connect(PKG);s.start();return true}catch(e){return false}}
const SH_FL=[[.14,.25],[.53,.65],[.95,1.04],[1.36,1.44],[1.8,1.87],[2.28,2.35],[2.74,2.82]],SH_PK=[.25,.66,1.05,1.44,1.87,2.35,2.83];
function grain(name,off,dur,v,rate=1){const b=PACK[name];if(!b||!PKG)return false;try{const s=AC.createBufferSource(),g=AC.createGain(),t=AC.currentTime;s.buffer=b;s.playbackRate.value=rate;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.005);g.gain.setValueAtTime(v,t+Math.max(.006,dur-.015));g.gain.linearRampToValueAtTime(0,t+dur);s.connect(g).connect(PKG);s.start(t,off,dur+.02);return true}catch(e){return false}}
function out(rev){const g=AC.createGain();g.connect(MASTER);if(rev){const s=AC.createGain();s.gain.value=rev;g.connect(s).connect(REV)}return g}
let PV={r:1,g:1,d:1};
function note(f,t0,dur,o={}){if(!AC||!sndOn())return;try{f*=PV.r;dur*=PV.d;if(PV.g!==1)o={...o,g:(o.g??.15)*PV.g};if(PV.r!==1&&o.slide)o={...o,slide:o.slide*PV.r};while(f>1000)f/=2;if(o.slide)while(o.slide>1000)o.slide/=2;
const t=AC.currentTime+t0,dst=out(o.rev??.3),parts=(o.partials||[[1,1,1]]).filter(p=>p[0]<=3.2).map(p=>[p[0],p[1]*(p[0]>1?.5:1),p[2]]);dur=Math.max(dur,.18);const harsh=false;if(o.type==='square'||o.type==='sawtooth')o={...o,type:'triangle'};
if(f<700&&o.body!==false){const sb=AC.createOscillator(),sg=AC.createGain();sb.type='sine';sb.frequency.setValueAtTime(f/2,t);sg.gain.setValueAtTime(0,t);sg.gain.linearRampToValueAtTime((o.g??.15)*.35,t+.02);sg.gain.setTargetAtTime(0,t+.05,Math.max(.06,dur*.3));sb.connect(sg).connect(dst);sb.start(t);sb.stop(t+dur*1.5+.1)}
for(const [m,pg,dm] of parts){const os=AC.createOscillator(),g=AC.createGain();os.type=o.type||'sine';os.frequency.setValueAtTime(o.slide?f*m:f*m*1.06,t);if(!o.slide)os.frequency.exponentialRampToValueAtTime(f*m,t+.05);

const d=dur*(dm||1)*1.15,peak=(o.g??.15)*pg*(harsh?.7:.9);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+Math.max(.018,o.a??.018));g.gain.setTargetAtTime(0,t+Math.max(.02,d*.28),d*.22);
let n=os;{const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=Math.min(o.lpf||1800,2200);fl.Q.value=.5;n.connect(fl);n=fl}
n.connect(g).connect(dst);os.start(t);os.stop(t+d*1.6+.1)}}catch(e){}}
function noiz(t0,dur,o={}){if(!AC||!sndOn())return;try{
const t=AC.currentTime+t0,len=Math.max(1,Math.floor(AC.sampleRate*dur)),b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type=(o.ft==='highpass')?'bandpass':(o.ft||'bandpass');const FC=o.paper?2300:1100;f.frequency.setValueAtTime(Math.min(o.f0||2000,FC),t);if(o.f1)f.frequency.exponentialRampToValueAtTime(Math.min(o.f1,FC),t+dur);f.Q.value=o.q||.8;
const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime((o.g??.1)*.75,t+Math.max(.008,o.a??.008));g.gain.setTargetAtTime(0,t+dur*.25,dur*.25);
s.connect(f).connect(g).connect(out(o.rev??.15));s.start(t)}catch(e){}}

/* adaptive placement test — a staircase: right → a little harder, wrong → a little easier,
ends after 20 correct answers (or 36 questions). The level is the average difficulty where the answers flip. */
function placement(lang,box,done,skip){
if(window.LEX_BANK_EXT&&BANKS[lang]!=='done'){box.innerHTML=`<div class="dim" style="padding:20px;text-align:center">${t('載入單字庫…','Loading the word bank…','単語データを読み込み中…')}</div>`;loadBank(lang).then(()=>placement(lang,box,done,skip));return}
const pool=wordsOf(lang).filter(w=>meaning(w));const asked=new Set();
/* Chinese speakers can read Japanese kanji (and Japanese speakers Chinese hanzi) without knowing the language:
then the word is shown only by its reading (kana / pinyin), and the options use readings too */
const byRead=(lang==='ja'&&S.main==='zh')||(lang==='zh'&&S.main==='ja');const face=w=>byRead&&w.r&&(lang==='zh'||/[\u3400-\u9fff]/.test(w.w))?w.r:w.w;/* katakana / kana words stay as written */
const GOAL=20,MAXQ=36;let est=24,step=10,q=0,right=0,last=null,wrongRun=0;const rev=[],hist=[];
const nb=(box.parentElement&&box.parentElement.querySelector('#newb'))||$('#newb');nb&&(nb.onclick=()=>{sfx('tick');skip()});
function result(){if(right<=1)return 1;const pts=rev.length>=3?rev.slice(-6):hist.slice(-8);const avg=pts.reduce((a,b)=>a+b,0)/Math.max(1,pts.length);
return clamp(Math.round((pts.length?avg:est)-4),1,90)}
function next(){
if(right>=GOAL||q>=MAXQ||(wrongRun>=6&&est<=4)){const lv=result();box.innerHTML=`<div style="text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center"><span class="hud">${t('你的程度','YOUR LEVEL','あなたのレベル')}</span><div class="big-score">Lv ${lv}</div><div class="dim">${cefr(lang,lv)} · ${t(`${q} 題中答對 ${right} 題`,`${right} of ${q} correct`,`${q}問中${right}問正解`)}</div><button class="btn p big" id="plok" style="margin-top:6px">${t('就從這裡開始','Start here','ここから始める')} →</button></div>`;sfx('win');$('#plok',box).onclick=()=>done(lv);const nb2=box.parentElement&&box.parentElement.querySelector('#newb');nb2&&(nb2.style.display='none');return}
const near=pool.filter(w=>!asked.has(w.id)&&Math.abs(w.d-est)<=Math.max(6,step));
const cand=(near.length>=4?near:pool.filter(w=>!asked.has(w.id)).sort((a,b)=>Math.abs(a.d-est)-Math.abs(b.d-est)).slice(0,8));if(!cand.length){q=MAXQ;return next()}
const w=rnd(cand);asked.add(w.id);const flip=q%3===2;/* every third question goes the other way: meaning → word */
const dpool=pool.filter(x=>x.id!==w.id&&meaning(x)!==meaning(w)&&face(x)!==face(w));
const opts=shuffle([w,...shuffle(dpool).sort((a,b)=>Math.abs(a.d-w.d)-Math.abs(b.d-w.d)).slice(0,6).sort(()=>Math.random()-.5).slice(0,3)]);
const main=flip?`<div class="q-main" style="font-size:calc(26px * var(--fs))">${esc(meaning(w))}</div><div class="q-sub">${t(`選出對應的${lname(lang)}`,`Pick the ${lname(lang)} word`,`${lname(lang)}を選んでください`)}</div>`
:`<div class="q-main">${esc(face(w))}</div>${!byRead&&w.r&&w.r!==w.w&&lang!=='en'?`<div class="q-sub">${esc(w.r)}</div>`:''}`;
box.innerHTML=`<div class="prog" style="flex:none"><i style="--w:${right/GOAL*100}%"></i></div><div class="row" style="justify-content:space-between"><span class="hud">${t('第','Q','第')} ${q+1}${t(' 題','',' 問')}</span><span class="hud">${t('答對','CORRECT','正解')} ${right} / ${GOAL}</span></div>${main}
<div class="opts">${opts.map((o,i)=>`<button class="opt panel" data-i="${i}"><span class="k">${i+1}</span><span>${esc(flip?face(o):meaning(o))}</span></button>`).join('')}</div><button class="btn s" id="idk">${t('不知道','Don\'t know','わからない')}</button>`;
$$('.opt',box).forEach((o,i)=>{o.animate([{transform:'translateY(10px)',opacity:.2},{transform:'none',opacity:1}],{duration:320,delay:i*40,easing:SPRING_SOFT,fill:'backwards'});o.onclick=()=>ans(opts[i].id===w.id,o)});
$('#idk',box).onclick=()=>ans(false,null);
function ans(ok,o){$$('.opt',box).forEach((x,j)=>{x.disabled=true;if(opts[j].id===w.id)x.classList.add('right');else if(x===o)x.classList.add('wrong')});sfx(ok?'ok':'bad');
hist.push(est);if(last!==null&&last!==ok){rev.push(est);step=Math.max(3,step*.7)}last=ok;
if(ok){right++;wrongRun=0;est=clamp(est+step,1,92)}else{wrongRun++;est=clamp(est-step*1.2,1,92)}
q++;setTimeout(next,ok?420:800)}}
next();
}

const c=el(`<div class="coach"><div class="hole"></div><div class="tip panel"><div id="ctx" style="font-size:calc(14.5px * var(--fs));line-height:1.6"></div><div class="row" style="margin-top:10px"><span class="hud" id="cn"></span><span class="grow"></span><button class="btn s sm" id="csk">${t('跳過','Skip')}</button><button class="btn p sm" id="cnx">${t('下一個','Next')}</button></div></div></div>`);
window.scrollTo(0,0);document.body.classList.add('touring');['touchmove','wheel'].forEach(ev=>c.addEventListener(ev,e=>e.preventDefault(),{passive:false}));let i=0;document.body.append(c);const onRs=()=>{if(c.isConnected)place()};addEventListener('resize',onRs);
function place(){const [sel,tx]=steps[i];const tg=$(sel);if(!tg){next();return}const r=tg.getBoundingClientRect(),h=$('.hole',c),tp=$('.tip',c);
h.style.left=(r.left-6)+'px';h.style.top=(r.top-6)+'px';h.style.width=(r.width+12)+'px';h.style.height=(r.height+12)+'px';
$('#ctx',c).textContent=tx;$('#cn',c).textContent=`${i+1}/${steps.length}`;const tw=Math.min(300,innerWidth-24);tp.style.width=tw+'px';
const below=r.top<innerHeight/2;tp.style.left=clamp(r.left+r.width/2-tw/2,12,innerWidth-tw-12)+'px';tp.style.top=below?(r.bottom+16)+'px':'auto';tp.style.bottom=below?'auto':(innerHeight-r.top+16)+'px';sfx('tick')}
function next(){i++;if(i>=steps.length)return end();place()}
function end(){c.remove();document.body.classList.remove('touring');removeEventListener('resize',onRs);S.tour=true;save();if(!force)setTimeout(styleTip,500)}
$('#cnx',c).onclick=next;$('#csk',c).onclick=end;place();
}

if(S.pulls>0&&S.cur&&S.L[S.cur]){S.L[S.cur].tix=(S.L[S.cur].tix|0)+S.pulls;S.pulls=0}for(const L of Object.values(S.L))if(L.tix==null)L.tix=0;
if(S.preset!=='rand'&&!PRESET_BY[S.preset]&&!(String(S.preset).startsWith('t:')&&THEME_BY[S.preset.slice(2)]))S.preset='glass';if(!['auto','light','dark'].includes(S.scheme))S.scheme='auto';if(!EDGE_BY[S.edge])S.edge='round';resolveTheme();

await audioInit();sp.classList.add('boot');bootChime();
let skip;const sk=new Promise(r=>skip=r);const skipFn=()=>skip();sp.addEventListener('click',skipFn);
const id=bootKey();
await Promise.race([playBoot(id,$('#bstage'),16),sk]);
sp.removeEventListener('click',skipFn);sp.classList.add('gone');setTimeout(()=>sp.remove(),800);

}

document.addEventListener('pointerdown',()=>audioInit(),{once:true,capture:true})}
else if(direct){/* just signed in: no boot animation, straight to the home page */const sp=$('#splash');sp&&sp.remove();document.addEventListener('pointerdown',()=>audioInit(),{once:true,capture:true});startMain(false)}
else{const sp=$('#splash');sp.style.visibility='';const g=$('.sp-go');g&&(g.style.display='none');/* auto-start: no tap needed; the first tap anywhere still renews the cloud login (popup needs a gesture) and unlocks audio */document.addEventListener('pointerdown',()=>{window.LEX_WEB&&webTapReconnect();audioInit()},{once:true,capture:true});boot()}}
